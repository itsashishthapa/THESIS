<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#111827"/>
    </marker>
  </defs>

  <rect width="1200" height="470" fill="#ffffff"/>

  <rect x="70" y="135" width="360" height="200" rx="24" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <text x="250" y="205" text-anchor="middle" font-family="Latin Modern Roman, serif" font-size="50" font-weight="600" fill="#111827">Agent</text>
  <text x="250" y="260" text-anchor="middle" font-family="Latin Modern Roman, serif" font-size="31" fill="#374151">observes state xₜ</text>
  <text x="250" y="305" text-anchor="middle" font-family="Latin Modern Roman, serif" font-size="31" fill="#374151">uses policy πₜ(· | xₜ)</text>

  <rect x="770" y="135" width="360" height="200" rx="24" fill="#ffffff" stroke="#111827" stroke-width="4"/>
  <text x="950" y="205" text-anchor="middle" font-family="Latin Modern Roman, serif" font-size="50" font-weight="600" fill="#111827">Environment</text>
  <text x="950" y="260" text-anchor="middle" font-family="Latin Modern Roman, serif" font-size="31" fill="#374151">transition kernel Qₜ</text>
  <text x="950" y="305" text-anchor="middle" font-family="Latin Modern Roman, serif" font-size="31" fill="#374151">stage reward rₜ</text>

  <path d="M 430 185 H 748" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="590" y="125" text-anchor="middle" font-family="Latin Modern Roman, serif" font-size="34" fill="#111827">action  aₜ ∈ Dₜ(xₜ)</text>

  <path d="M 770 305 H 452" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="600" y="385" text-anchor="middle" font-family="Latin Modern Roman, serif" font-size="32" fill="#111827">reward  rₜ(xₜ,aₜ)</text>
  <text x="600" y="430" text-anchor="middle" font-family="Latin Modern Roman, serif" font-size="32" fill="#111827">next state  xₜ₊₁ ∼ Qₜ(· | xₜ,aₜ)</text>
</svg>
